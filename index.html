<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APML Support Page</title>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="APML App">
<meta name="theme-color" content="#991b1b">

<link rel="manifest" href='data:application/manifest+json,{
  "name": "APML Support App",
  "short_name": "APML",
  "start_url": "./",
  "display": "standalone",
  "background_color": "#ffffff",
  "theme_color": "#991b1b",
  "icons": [
    {
      "src": "https://github.com/kundarwork-debug.png",
      "sizes": "512x512",
      "type": "image/png"
    }
  ]
}'>

<link rel="icon" type="image/png" href="https://github.com/kundarwork-debug.png">

<style>
  :root {
    --bg-main: #f8fafc;
    --radius: 8px;
    --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; } [cite: 1]
  
  body {
    margin: 0; [cite: 1]
    background: var(--bg-main); [cite: 2]
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; [cite: 2]
    color: #0f172a; [cite: 2]
    -webkit-font-smoothing: antialiased; [cite: 3]
  }

  /* ---------- LANDING PAGE WITH BACKGROUND IMAGE ---------- */
  .landing-page {
    display: flex; [cite: 3]
    flex-direction: column; [cite: 4]
    justify-content: center; [cite: 4]
    align-items: center; [cite: 4]
    min-height: 100vh; [cite: 4]
    padding: 24px; [cite: 4]
    background: linear-gradient(rgba(254, 242, 242, 0.85), rgba(254, 242, 242, 0.95)), url('image_6c9245.png'); [cite: 5]
    background-size: cover; [cite: 5]
    background-position: center; [cite: 5]
    background-repeat: no-repeat; [cite: 6]
    position: relative; [cite: 6]
    text-align: center; [cite: 6]
    overflow: hidden; [cite: 6]
  }

  .welcome-box {
    background: rgba(255, 255, 255, 0.9); [cite: 7]
    padding: 60px; [cite: 7]
    border-radius: 16px; [cite: 7]
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); [cite: 8]
    backdrop-filter: blur(5px); [cite: 8]
  }

  .welcome-title {
    font-size: 48px; [cite: 8]
    font-weight: 800; [cite: 8]
    color: #991b1b; [cite: 9]
    margin: 0 0 32px; [cite: 9]
    letter-spacing: -0.03em; [cite: 9]
  }

  .landing-btn {
    display: inline-block; [cite: 9]
    padding: 20px 48px; [cite: 9]
    font-size: 18px; [cite: 9]
    font-weight: 600; [cite: 10]
    color: #ffffff; [cite: 10]
    background: #991b1b; [cite: 10]
    border: none; [cite: 10]
    border-radius: var(--radius); [cite: 10]
    cursor: pointer; [cite: 10]
    text-decoration: none; [cite: 10]
    letter-spacing: -0.01em; [cite: 10]
    transition: var(--transition); [cite: 10]
    box-shadow: 0 4px 14px rgba(153, 27, 27, 0.25); [cite: 11]
  }

  .landing-btn:hover {
    transform: translateY(-3px); [cite: 12]
    box-shadow: 0 8px 24px rgba(153, 27, 27, 0.35); [cite: 12]
    background: #7f1d1d; [cite: 12]
  }

  /* ---------- ALWAYS-VISIBLE MOBILE INSTALL BANNER ---------- */
  .install-banner {
    display: none;
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 420px;
    background: #ffffff;
    border: 1px solid #fca5a5;
    padding: 12px 16px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    z-index: 100;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .install-banner-text {
    text-align: left;
    font-size: 12.5px;
    color: #0f172a;
    line-height: 1.3;
  }

  .install-banner-text strong {
    display: block;
    color: #991b1b;
    font-size: 13.5px;
    margin-bottom: 2px;
  }

  .install-app-btn {
    padding: 8px 14px;
    background: #991b1b;
    color: #ffffff;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    font-size: 12.5px;
    cursor: pointer;
    white-space: nowrap;
  }

  .close-banner {
    background: none;
    border: none;
    font-size: 16px;
    color: #64748b;
    cursor: pointer;
    padding: 0 4px;
  }

  /* ---------- STATIC BOTTOM FOOTER ---------- */
  .landing-footer-wrap {
    position: absolute; [cite: 13]
    bottom: 0; [cite: 13]
    left: 0; [cite: 13]
    right: 0; [cite: 13]
    padding: 16px 36px; [cite: 14]
    display: flex; [cite: 14]
    align-items: center; [cite: 14]
    justify-content: space-between; [cite: 14]
    background: rgba(254, 242, 242, 0.92); [cite: 14]
    backdrop-filter: blur(10px); [cite: 14]
    border-top: 1px solid rgba(252, 165, 165, 0.35); [cite: 15]
    z-index: 10; [cite: 15]
  }

  .footer-brand {
    font-size: 12.5px; [cite: 16]
    color: #991b1b; [cite: 16]
    font-weight: 700; [cite: 16]
    letter-spacing: 0.06em; [cite: 16]
    text-transform: uppercase; [cite: 16]
  }

  .about-me-btn {
    display: inline-flex; [cite: 16]
    align-items: center; [cite: 17]
    gap: 10px; [cite: 17]
    padding: 8px 16px; [cite: 17]
    background: #ffffff; [cite: 17]
    color: #0f172a; [cite: 17]
    border: 1px solid #fca5a5; [cite: 17]
    border-radius: 30px; [cite: 17]
    font-size: 13px; [cite: 17]
    font-weight: 600; [cite: 17]
    text-decoration: none; [cite: 18]
    transition: var(--transition); [cite: 18]
    box-shadow: 0 2px 8px rgba(153, 27, 27, 0.08); [cite: 18]
  }

  .about-me-btn:hover {
    background: #991b1b; [cite: 19]
    color: #ffffff; [cite: 19]
    border-color: #991b1b; [cite: 19]
    box-shadow: 0 4px 14px rgba(153, 27, 27, 0.25); [cite: 19]
    transform: translateY(-1px); [cite: 19]
  }

  .github-avatar {
    width: 24px; [cite: 20]
    height: 24px; [cite: 20]
    border-radius: 50%; [cite: 20]
    object-fit: cover; [cite: 20]
    border: 1.5px solid #fca5a5; [cite: 20]
    background: #f1f5f9; [cite: 20]
    transition: var(--transition); [cite: 20]
  }

  .about-me-btn:hover .github-avatar {
    border-color: #ffffff; [cite: 21]
  }

  /* ---------- MOBILE ADJUSTMENTS ---------- */
  @media (max-width: 768px) {
    .welcome-box {
      width: 90%; [cite: 21]
      padding: 30px 20px !important; [cite: 22]
      margin: 0 16px; [cite: 22]
    }

    .welcome-title {
      font-size: 28px !important; [cite: 23]
      margin-bottom: 24px !important; [cite: 23]
    }

    .landing-btn {
      width: 100%; [cite: 23]
      padding: 14px 20px !important; [cite: 24]
      font-size: 15px !important; [cite: 24]
    }

    .landing-footer-wrap {
      padding: 12px 16px !important; [cite: 24]
      flex-direction: column; [cite: 24]
      gap: 10px; [cite: 24]
    }
  }
</style>
</head>
<body>

<div class="install-banner" id="installBanner">
  <div class="install-banner-text">
    <strong>Install APML App</strong>
    <span id="bannerSubtext">Add shortcut to home screen</span>
  </div>
  <button class="install-app-btn" id="installBtn">Add Shortcut</button>
  <button class="close-banner" id="closeBannerBtn">&times;</button>
</div>

<div class="landing-page" id="landingPage">
  <div class="welcome-box">
    <h1 class="welcome-title">We're glad you're here!</h1>
    <a href="editor.html" class="landing-btn">Supporting Quotation</a>
  </div>

  <div class="landing-footer-wrap">
    <div class="footer-brand">By Prasad</div>
    <a href="about.html" class="about-me-btn">
      <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="GitHub" class="github-avatar">
      About Me ↗
    </a>
  </div>
</div>

<script>
  let deferredPrompt;
  const installBanner = document.getElementById('installBanner');
  const installBtn = document.getElementById('installBtn');
  const bannerSubtext = document.getElementById('bannerSubtext');
  const closeBannerBtn = document.getElementById('closeBannerBtn');

  // Check if device is mobile
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  if (isMobile) {
    installBanner.style.display = 'flex';
  }

  // Handle native prompt event if triggered
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
  });

  installBtn.addEventListener('click', async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBanner.style.display = 'none';
      }
      deferredPrompt = null;
    } else {
      // Fallback instructions if native prompt isn't fired
      alert("To add shortcut to home screen:\n\n1. Tap the 3 dots (⋮) or Share button in your browser.\n2. Tap 'Add to Home screen' or 'Install app'.");
    }
  });

  closeBannerBtn.addEventListener('click', () => {
    installBanner.style.display = 'none';
  });

  // Register minimal Service Worker
  if ('serviceWorker' in navigator) {
    const swCode = `self.addEventListener('fetch', (e) => {});`;
    const blob = new Blob([swCode], { type: 'text/javascript' });
    const url = URL.createObjectURL(blob);
    navigator.serviceWorker.register(url).catch(() => {});
  }
</script>

</body>
</html>
