<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APML Support Page</title>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="APML App">
<meta name="theme-color" content="#991b1b">

<link rel="manifest" href='data:application/manifest+json,{
  "name": "APML Support App",
  "short_name": "APML",
  "start_url": "./",
  "display": "standalone",
  "background_color": "#ffffff",
  "theme_color": "#991b1b",
  "icons": [
    {
      "src": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
      "sizes": "512x512",
      "type": "image/png"
    }
  ]
}'>

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2242%22 fill=%22none%22 stroke=%22%23b91c1c%22 stroke-width=%229%22/><text x=%2250%22 y=%2262%22 font-size=%2238%22 font-family=%22Arial, Helvetica, sans-serif%22 font-weight=%22900%22 fill=%22%23b91c1c%22 text-anchor=%22middle%22 letter-spacing=%22-1%22>KP</text></svg>">

<style>
  :root {
    --bg-main: #f8fafc;
    --radius: 8px;
    --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    background: var(--bg-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #0f172a;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- LANDING PAGE WITH BACKGROUND IMAGE ---------- */
  .landing-page {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
    background: linear-gradient(rgba(254, 242, 242, 0.85), rgba(254, 242, 242, 0.95)), url('image_6c9245.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    position: relative;
    text-align: center;
    overflow: hidden;
  }

  .welcome-box {
    background: rgba(255, 255, 255, 0.9);
    padding: 60px;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    backdrop-filter: blur(5px);
  }

  .welcome-title {
    font-size: 48px;
    font-weight: 800;
    color: #991b1b;
    margin: 0 0 32px;
    letter-spacing: -0.03em;
  }

  .landing-btn {
    display: inline-block;
    padding: 20px 48px;
    font-size: 18px;
    font-weight: 600;
    color: #ffffff;
    background: #991b1b;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    text-decoration: none;
    letter-spacing: -0.01em;
    transition: var(--transition);
    box-shadow: 0 4px 14px rgba(153, 27, 27, 0.25);
  }

  .landing-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(153, 27, 27, 0.35);
    background: #7f1d1d;
  }

  /* ---------- ALWAYS-VISIBLE MOBILE INSTALL BANNER ---------- */
  .install-banner {
    display: none; /* Controlled by JavaScript */
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 420px;
    background: #ffffff;
    border: 1px solid #fca5a5;
    padding: 12px 16px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    z-index: 100;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .install-banner-text {
    text-align: left;
    font-size: 12.5px;
    color: #0f172a;
    line-height: 1.3;
  }

  .install-banner-text strong {
    display: block;
    color: #991b1b;
    font-size: 13.5px;
    margin-bottom: 2px;
  }

  .install-app-btn {
    padding: 8px 14px;
    background: #991b1b;
    color: #ffffff;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    font-size: 12.5px;
    cursor: pointer;
    white-space: nowrap;
  }

  .close-banner {
    background: none;
    border: none;
    font-size: 16px;
    color: #64748b;
    cursor: pointer;
    padding: 0 4px;
  }

  /* ---------- STATIC BOTTOM FOOTER ---------- */
  .landing-footer-wrap {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 16px 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(254, 242, 242, 0.92);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(252, 165, 165, 0.35);
    z-index: 10;
  }

  .footer-brand {
    font-size: 12.5px;
    color: #991b1b;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .about-me-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    background: #ffffff;
    color: #0f172a;
    border: 1px solid #fca5a5;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    transition: var(--transition);
    box-shadow: 0 2px 8px rgba(153, 27, 27, 0.08);
  }

  .about-me-btn:hover {
    background: #991b1b;
    color: #ffffff;
    border-color: #991b1b;
    box-shadow: 0 4px 14px rgba(153, 27, 27, 0.25);
    transform: translateY(-1px);
  }

  .github-avatar {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    object-fit: cover;
    border: 1.5px solid #fca5a5;
    background: #f1f5f9;
    transition: var(--transition);
  }

  .about-me-btn:hover .github-avatar {
    border-color: #ffffff;
  }

  /* ---------- MOBILE ADJUSTMENTS ---------- */
  @media (max-width: 768px) {
    .welcome-box {
      width: 90%;
      padding: 30px 20px !important;
      margin: 0 16px;
    }

    .welcome-title {
      font-size: 28px !important;
      margin-bottom: 24px !important;
    }

    .landing-btn {
      width: 100%;
      padding: 14px 20px !important;
      font-size: 15px !important;
    }

    .landing-footer-wrap {
      padding: 12px 16px !important;
      flex-direction: column;
      gap: 10px;
    }
  }
</style>
</head>
<body>

<div class="install-banner" id="installBanner">
  <div class="install-banner-text">
    <strong>Install APML App</strong>
    <span id="bannerSubtext">Add shortcut to home screen</span>
  </div>
  <button class="install-app-btn" id="installBtn">Add Shortcut</button>
  <button class="close-banner" id="closeBannerBtn">&times;</button>
</div>

<div class="landing-page" id="landingPage">
  <div class="welcome-box">
    <h1 class="welcome-title">We're glad you're here!</h1>
    <a href="editor.html" class="landing-btn">Supporting Quotation</a>
  </div>

  <div class="landing-footer-wrap">
    <div class="footer-brand">By Prasad</div>
    <a href="about.html" class="about-me-btn">
      <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="GitHub" class="github-avatar">
      About Me ↗
    </a>
  </div>
</div>

<script>
  let deferredPrompt;
  const installBanner = document.getElementById('installBanner');
  const installBtn = document.getElementById('installBtn');
  const bannerSubtext = document.getElementById('bannerSubtext');
  const closeBannerBtn = document.getElementById('closeBannerBtn');

  // Check if device is mobile
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  if (isMobile) {
    installBanner.style.display = 'flex';
  }

  // Handle native prompt event if triggered
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
  });

  installBtn.addEventListener('click', async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBanner.style.display = 'none';
      }
      deferredPrompt = null;
    } else {
      // Fallback instructions if native prompt isn't fired (e.g. non-HTTPS, local test, or iOS)
      alert("To add shortcut to home screen:\n\n1. Tap the 3 dots (⋮) or Share button in your browser.\n2. Tap 'Add to Home screen' or 'Install app'.");
    }
  });

  closeBannerBtn.addEventListener('click', () => {
    installBanner.style.display = 'none';
  });

  // Register minimal Service Worker
  if ('serviceWorker' in navigator) {
    const swCode = `self.addEventListener('fetch', (e) => {});`;
    const blob = new Blob([swCode], { type: 'text/javascript' });
    const url = URL.createObjectURL(blob);
    navigator.serviceWorker.register(url).catch(() => {});
  }
</script>

</body>
</html>
