<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APML Support Page</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2242%22 fill=%22none%22 stroke=%22%23b91c1c%22 stroke-width=%229%22/><text x=%2250%22 y=%2262%22 font-size=%2238%22 font-family=%22Arial, Helvetica, sans-serif%22 font-weight=%22900%22 fill=%22%23b91c1c%22 text-anchor=%22middle%22 letter-spacing=%22-1%22>KP</text></svg>">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="APML Support">
<meta name="theme-color" content="#991b1b">

<style>
  :root {
    --bg-main: #f8fafc;
    --radius: 8px;
    --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    background: var(--bg-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #0f172a;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- LANDING PAGE ---------- */
  .landing-page {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
    background: linear-gradient(rgba(254, 242, 242, 0.85), rgba(254, 242, 242, 0.95)), url('image_6c9245.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    position: relative;
    text-align: center;
    overflow: hidden;
  }

  .welcome-box {
    background: rgba(255, 255, 255, 0.9);
    padding: 60px;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    backdrop-filter: blur(5px);
  }

  .welcome-title {
    font-size: 48px;
    font-weight: 800;
    color: #991b1b;
    margin: 0 0 32px;
    letter-spacing: -0.03em;
  }

  .landing-btn {
    display: inline-block;
    padding: 20px 48px;
    font-size: 18px;
    font-weight: 600;
    color: #ffffff;
    background: #991b1b;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    text-decoration: none;
    letter-spacing: -0.01em;
    transition: var(--transition);
    box-shadow: 0 4px 14px rgba(153, 27, 27, 0.25);
  }

  .landing-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(153, 27, 27, 0.35);
    background: #7f1d1d;
  }

  /* ---------- FOOTER ---------- */
  .landing-footer-wrap {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 16px 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(254, 242, 242, 0.92);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(252, 165, 165, 0.35);
    z-index: 10;
  }

  .footer-brand {
    font-size: 12.5px;
    color: #991b1b;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .about-me-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    background: #ffffff;
    color: #0f172a;
    border: 1px solid #fca5a5;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    transition: var(--transition);
    box-shadow: 0 2px 8px rgba(153, 27, 27, 0.08);
  }

  .about-me-btn:hover {
    background: #991b1b;
    color: #ffffff;
    border-color: #991b1b;
    box-shadow: 0 4px 14px rgba(153, 27, 27, 0.25);
    transform: translateY(-1px);
  }

  .github-avatar {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    object-fit: cover;
    border: 1.5px solid #fca5a5;
    background: #f1f5f9;
    transition: var(--transition);
  }

  /* ---------- SHORTCUT POPUP MODAL ---------- */
  .shortcut-modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(4px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
    padding: 20px;
  }

  .shortcut-modal-overlay.active {
    opacity: 1;
    visibility: visible;
  }

  .shortcut-modal-card {
    background: #ffffff;
    padding: 32px 24px;
    border-radius: 16px;
    text-align: center;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    transform: scale(0.9);
    transition: transform 0.3s ease;
  }

  .shortcut-modal-overlay.active .shortcut-modal-card {
    transform: scale(1);
  }

  .shortcut-icon {
    width: 64px;
    height: 64px;
    background: #fef2f2;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    color: #991b1b;
  }

  .shortcut-modal-title {
    font-size: 20px;
    font-weight: 700;
    color: #0f172a;
    margin: 0 0 8px;
  }

  .shortcut-modal-desc {
    font-size: 14px;
    color: #64748b;
    margin: 0 0 20px;
    line-height: 1.5;
  }

  .shortcut-btn-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .shortcut-add-btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: #991b1b;
    color: #ffffff;
    font-weight: 600;
    font-size: 15px;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(153, 27, 27, 0.2);
    transition: var(--transition);
  }

  .shortcut-add-btn:hover {
    background: #7f1d1d;
  }

  .shortcut-close-btn {
    background: transparent;
    border: none;
    color: #64748b;
    font-size: 14px;
    font-weight: 500;
    padding: 8px;
    cursor: pointer;
  }

  /* Responsive Adjustments */
  @media (max-width: 768px) {
    .welcome-box {
      width: 90%;
      padding: 30px 20px !important;
      margin: 0 16px;
    }

    .welcome-title {
      font-size: 28px !important;
      margin-bottom: 24px !important;
    }

    .landing-btn {
      width: 100%;
      padding: 14px 20px !important;
      font-size: 15px !important;
    }

    .landing-footer-wrap {
      padding: 12px 16px !important;
      flex-direction: column;
      gap: 10px;
    }
  }
</style>
</head>
<body>

<div class="landing-page" id="landingPage">
  <div class="welcome-box">
    <h1 class="welcome-title">We're glad you're here!</h1>
    <a href="editor.html" class="landing-btn">Supporting Quotation</a>
  </div>

  <div class="landing-footer-wrap">
    <div class="footer-brand">By Prasad</div>
    <a href="about.html" class="about-me-btn">
      <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="GitHub" class="github-avatar">
      About Me ↗
    </a>
  </div>
</div>

<div class="shortcut-modal-overlay" id="shortcutModal">
  <div class="shortcut-modal-card">
    <div class="shortcut-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
        <line x1="12" y1="18" x2="12.01" y2="18"/>
      </svg>
    </div>
    <h3 class="shortcut-modal-title">Add to Home Screen</h3>
    <p class="shortcut-modal-desc" id="shortcutInstruction">
      Add this web page to your home screen for quick and easy access.
    </p>
    <div class="shortcut-btn-group">
      <button class="shortcut-add-btn" id="installShortcutBtn">Add Shortcut</button>
      <button class="shortcut-close-btn" onclick="closeShortcutModal()">Maybe Later</button>
    </div>
  </div>
</div>

<script>
  let deferredPrompt = null;

  function isMobileDevice() {
    return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) 
      || window.innerWidth <= 768;
  }

  function isIOS() {
    return /iPhone|iPad|iPod/i.test(navigator.userAgent);
  }

  function closeShortcutModal() {
    document.getElementById('shortcutModal').classList.remove('active');
  }

  // Intercept native install prompt on Chrome/Android
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    showShortcutModal();
  });

  function showShortcutModal() {
    const modal = document.getElementById('shortcutModal');
    const instruction = document.getElementById('shortcutInstruction');
    const installBtn = document.getElementById('installShortcutBtn');

    if (isIOS()) {
      instruction.innerHTML = 'Tap the <strong>Share</strong> button <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg> in Safari, then select <strong>"Add to Home Screen"</strong>.';
      installBtn.style.display = 'none'; // iOS requires manual share menu interaction
    }

    modal.classList.add('active');
  }

  // Button handler for Android/Desktop Chrome
  document.getElementById('installShortcutBtn').addEventListener('click', async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      deferredPrompt = null;
      closeShortcutModal();
    } else {
      // Fallback instructions if automatic prompt isn't supported by browser
      alert('To add a shortcut, open your browser menu (⋮) and tap "Add to Home screen".');
      closeShortcutModal();
    }
  });

  // Fallback trigger for iOS or mobile devices where beforeinstallprompt isn't fired
  window.addEventListener('DOMContentLoaded', () => {
    if (isMobileDevice() && isIOS()) {
      setTimeout(showShortcutModal, 1000);
    }
  });
</script>

</body>
</html>
